<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Dashboard</title>
<style>
    body { font-family: Arial, sans-serif; margin:0; padding:0; }
    body.dark { background:#121212; color:#e0e0e0; }
    .container { width:90%; margin:20px auto; }
    h1 { text-align:center; }
    .toolbar { margin-bottom:15px; display:flex; justify-content:space-between; align-items:center; }
    .toolbar input, .toolbar button { padding:5px; border-radius:4px; }
    .toolbar input { width:200px; background:#1e1e1e; color:#e0e0e0; border:1px solid #555; }
    .toolbar button { background:#3a3a3a; color:#fff; border:none; cursor:pointer; }
    .toolbar button:hover { background:#555; }
    table { width:100%; border-collapse:collapse; margin-top:10px; }
    table th, table td { padding:8px; border:1px solid #555; text-align:left; }
    table th { background:#1e1e1e; }
    table tr:nth-child(even) { background:#1a1a1a; }
    table tr:hover { background:#333; }
    .view-btn { padding:3px 6px; background:#007bff; color:#fff; border:none; cursor:pointer; }
    .view-btn:hover { background:#0056b3; }
    a.pdf-link { color:#ff9800; text-decoration:none; }
    a.pdf-link:hover { text-decoration:underline; }
    #client-detail { margin-top:20px; display:none; }
    #client-detail table { margin-top:5px; }
    #toggle-mode { position:fixed; top:10px; right:10px; padding:5px; }
</style>
</head>
<body class="dark">
<div class="container">
    <h1>Client Monitoring Dashboard</h1>
    <div class="toolbar">
        <input type="text" id="search" placeholder="Search clients...">
        <div>
            <button onclick="exportCSV()">Export CSV</button>
            <button id="toggle-mode">Toggle Dark/Light</button>
        </div>
    </div>
    <table>
        <thead>
            <tr>
                <th>UUID</th><th>MAC</th><th>Hostname</th><th>IP</th>
                <th>Last Seen</th><th>Status</th><th>Actions</th>
            </tr>
        </thead>
        <tbody id="clients-body"></tbody>
    </table>

    <div id="client-detail">
        <button onclick="hideDetail()">Back</button>
        <button onclick="goHome()">Home</button>
        <h2>Client Detail</h2>
        <div id="hardware-section"></div>
        <input type="text" id="app-search" placeholder="Search Installed Apps...">
        <div id="apps-section"></div>
        <a id="pdf-download" target="_blank">Download PDF</a>
    </div>
</div>

<script>
async function loadClients(search="") {
    const res = await fetch(`/api/clients?search=${encodeURIComponent(search)}`);
    const data = await res.json();
    const tbody = document.getElementById("clients-body");
    tbody.innerHTML = "";
    if(!data.length) { tbody.innerHTML = `<tr><td colspan="7">No clients found</td></tr>`; return; }
    data.forEach(c=>{
        const tr=document.createElement("tr");
        tr.innerHTML=`<td>${c.uuid}</td><td>${c.mac}</td><td>${c.hostname}</td>
                      <td>${c.ip}</td><td>${c.last_seen}</td><td>${c.status}</td>
                      <td><button class="view-btn" onclick="viewClient('${c.uuid}')">View</button>
                          <a class="pdf-link" href="/export/pdf/${c.uuid}" target="_blank">PDF</a></td>`;
        tbody.appendChild(tr);
    });

async function viewClient(uuid){
    const res=await fetch(`/api/client/${uuid}`);
    const data=await res.json();
    document.getElementById("client-detail").style.display="block";
    document.querySelector("table").style.display="none";
    document.getElementById("clients-body").parentElement.style.display="none";

    let hwHTML="<h3>Hardware Info</h3><table>";
    for(const [k,v] of Object.entries(data.hardware)){ hwHTML+=`<tr><td>${k}</td><td>${v}</td></tr>`;}
    hwHTML+="</table>";
    document.getElementById("hardware-section").innerHTML=hwHTML;

    let appsHTML="<h3>Installed Apps</h3><table id='apps-table'>";
    data.apps.forEach(a=>appsHTML+=`<tr><td>${a}</td></tr>`);
    appsHTML+="</table>";
    document.getElementById("apps-section").innerHTML=appsHTML;

    document.getElementById("app-search").addEventListener("input", e=>{
        const val=e.target.value.toLowerCase();
        document.querySelectorAll("#apps-table tr").forEach(tr=>{
            tr.style.display=tr.innerText.toLowerCase().includes(val)?"":"none";
        });
    });

    document.getElementById("pdf-download").href=`/export/pdf/${uuid}`;
}
