<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise Client Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}
.container { padding:40px; }
h1,h2,h3,h4 { font-weight:600; }
.glass-card {
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    margin-bottom:25px;
}
.stats-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:25px;
}
.stat-card { text-align:center; font-size:18px; }
.stat-number { font-size:28px; font-weight:bold; margin-top:10px; }
input {
    width:70%;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    margin-bottom:20px;
    display:inline-block;
}
.global-btn {
    background:#8b5cf6;
    color:white;
    padding:12px 20px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-weight:600;
    margin-left:10px;
}
table { width:100%; border-collapse:collapse; }
th,td { padding:12px; text-align:left; }
tr { border-top:1px solid rgba(255,255,255,0.08); }
tr:hover { background:rgba(255,255,255,0.05); cursor:pointer; }
.status { padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; }
.online { background:rgba(16,185,129,0.2); color:#10b981; }
.offline { background:rgba(239,68,68,0.2); color:#ef4444; }
button { padding:6px 12px; border-radius:8px; border:none; cursor:pointer; font-size:12px; margin-right:5px; }
.view-btn { background:#3b82f6; color:white; }
.pdf-btn { background:#10b981; color:white; }
.csv-btn { background:#0ea5e9; color:white; }
.delete-btn { background:#ef4444; color:white; }
.back-btn { background:#64748b; color:white; margin-bottom:15px; }
.history-btn { background:#f59e0b; color:white; }
.hardware-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:15px; }
.hardware-item { background:rgba(255,255,255,0.06); padding:15px; border-radius:12px; }
.modal { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; overflow:auto; }
.modal-content { background:#1e293b; padding:20px; border-radius:12px; width:90%; max-width:800px; max-height:90%; overflow:auto; }
.section-title { font-size:18px; font-weight:600; margin-top:20px; margin-bottom:10px; }
</style>
</head>
<body>

<div class="container">
<h1 id="pageTitle">Enterprise Client Monitoring</h1>

<div id="dashboardView">
    <div class="stats-grid">
        <div class="glass-card stat-card">
            Total Clients
            <div class="stat-number" id="totalCount">0</div>
        </div>
        <div class="glass-card stat-card">
            Online
            <div class="stat-number" id="onlineCount">0</div>
        </div>
        <div class="glass-card stat-card">
            Offline
            <div class="stat-number" id="offlineCount">0</div>
        </div>
    </div>

    <div class="glass-card">
        <input type="text" id="searchInput" placeholder="Search clients..." onkeyup="loadClients()">
        <button class="global-btn" onclick="openGlobalSearch()">🔎 Global App Search</button>

        <table>
            <thead>
                <tr>
                    <th>UUID</th>
                    <th>Hostname</th>
                    <th>MAC</th>
                    <th>Last Seen</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="clientsTable"></tbody>
        </table>
    </div>
</div>

<div id="clientView" style="display:none;" class="glass-card">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div id="clientDetails"></div>
</div>

<!-- History Modal -->
<div id="historyModal" class="modal">
    <div class="modal-content">
        <h3>App History</h3>
        <div id="historyBody"></div>
        <br>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<!-- Global Search Modal -->
<div id="globalSearchModal" class="modal">
    <div class="modal-content">
        <h3>Global App Search</h3>
        <input type="text" id="globalSearchInput" placeholder="Enter app name...">
        <button class="global-btn" onclick="runGlobalSearch()">Search</button>
        <div id="globalSearchResults"></div>
        <br>
        <button onclick="closeGlobalSearch()">Close</button>
    </div>
</div>

<!-- Matching Apps Modal -->
<div id="appsModal" class="modal">
    <div class="modal-content">
        <h3>Matching Apps</h3>
        <div id="appsBody"></div>
        <br>
        <button onclick="closeAppsModal()">Close</button>
    </div>
</div>

<script>
const API_BASE="/api";
let currentUUID=null;

// ================= UTILITY =================
function formatSize(bytes){
    if(!bytes || bytes===0) return "0 MB";
    const mb = bytes / (1024*1024);
    if(mb < 1024) return mb.toFixed(2)+" MB";
    return (mb/1024).toFixed(2)+" GB";
}

function checkRoute(){
    const path=window.location.pathname;
    if(path.startsWith("/client/")){
        currentUUID=path.split("/client/")[1];
        showClientView();
    } else {
        showDashboardView();
    }
}

function showDashboardView(){
    document.getElementById("dashboardView").style.display="block";
    document.getElementById("clientView").style.display="none";
    document.getElementById("pageTitle").innerText="Enterprise Client Monitoring";
    loadClients();
}

function showClientView(){
    document.getElementById("dashboardView").style.display="none";
    document.getElementById("clientView").style.display="block";
    document.getElementById("pageTitle").innerText="Client Details";
    loadClient();
}

function goBack(){
    window.history.pushState({}, "", "/");
    showDashboardView();
}

// =================== LOAD CLIENTS ===================
async function loadClients(){
    const search=document.getElementById("searchInput")?.value||"";
    const res=await fetch(`${API_BASE}/clients?search=${encodeURIComponent(search)}`);
    const clients=await res.json();

    let total=clients.length,online=0,offline=0;
    const table=document.getElementById("clientsTable");
    table.innerHTML="";

    clients.forEach(c=>{
        if(c.status==="Online") online++; else offline++;
        table.innerHTML+=`
        <tr>
            <td>${c.uuid}</td>
            <td>${c.hostname}</td>
            <td>${c.mac}</td>
            <td>${c.last_seen}</td>
            <td><span class="status ${c.status==="Online"?"online":"offline"}">${c.status}</span></td>
            <td>
                <button class="view-btn" onclick="navigateClient('${c.uuid}')">View</button>
                <button class="pdf-btn" onclick="downloadPDF('${c.uuid}')">PDF</button>
                <button class="csv-btn" onclick="downloadCSV('${c.uuid}')">CSV</button>
                <button class="delete-btn" onclick="deleteClient('${c.uuid}')">Delete</button>
            </td>
        </tr>`;
    });

    document.getElementById("totalCount").innerText=total;
    document.getElementById("onlineCount").innerText=online;
    document.getElementById("offlineCount").innerText=offline;
}

function navigateClient(uuid){
    window.history.pushState({}, "", `/client/${uuid}`);
    currentUUID=uuid;
    showClientView();
}

// =================== SINGLE CLIENT ===================
async function loadClient(){
    const res=await fetch(`${API_BASE}/client/${currentUUID}`);
    const data=await res.json();

    let hwHTML="<div class='section-title'>Hardware Info</div><div class='hardware-grid'>";
    for (let k in data.hardware) {
        if(k==="Disks" && Array.isArray(data.hardware[k])){
            let disksHTML="<div class='hardware-item'><b>Disks</b>";
            data.hardware[k].forEach(d=>{
                disksHTML+=`<div style="margin-top:8px; padding:8px; background:rgba(255,255,255,0.05); border-radius:8px;">
                    <strong>${d.Device}</strong><br>
                    Total: ${d["Total (GB)"]} GB<br>
                    Free: ${d["Free (GB)"]} GB
                </div>`;
            });
            disksHTML+="</div>";
            hwHTML+=disksHTML;
        } else {
            hwHTML+=`<div class="hardware-item"><b>${k}</b><br>${data.hardware[k]}</div>`;
        }
    }
    hwHTML+="</div>";

    let appsHTML="<div class='section-title'>Installed Apps</div><table><tr><th>Name</th><th>Version</th><th>Install Date</th><th>Size</th><th>History</th></tr>";
    data.apps.forEach(a=>{
        appsHTML+=`<tr>
            <td>${a.name||""}</td>
            <td>${a.version||""}</td>
            <td>${a.install_date||""}</td>
            <td>${formatSize(a.size_bytes)}</td>
            <td><button class="history-btn" onclick="showHistory('${a.name}')">History</button></td>
        </tr>`;
    });
    appsHTML+="</table>";

    document.getElementById("clientDetails").innerHTML=`
        <p><b>UUID:</b> ${data.uuid}</p>
        <p><b>Hostname:</b> ${data.hostname}</p>
        <p><b>IP:</b> ${data.ip || "-"}</p>
        <p><b>MAC:</b> ${data.mac}</p>
        <p><b>Last Seen:</b> ${data.last_seen}</p>
        ${hwHTML}
        ${appsHTML}
    `;
}

// =================== APP HISTORY ===================
async function showHistory(app){
    document.getElementById("historyModal").style.display="flex";
    const res=await fetch(`${API_BASE}/client/${currentUUID}/history?app=${encodeURIComponent(app)}`);
    const history=await res.json();
    let html="<table><tr><th>Timestamp</th><th>Version</th><th>Install Date</th><th>Size</th></tr>";
    history.forEach(h=>{
        html+=`<tr><td>${h.timestamp}</td><td>${h.version}</td><td>${h.install_date}</td><td>${formatSize(h.size_bytes)}</td></tr>`;
    });
    html+="</table>";
    document.getElementById("historyBody").innerHTML=html;
}
function closeModal(){ document.getElementById("historyModal").style.display="none"; }

// =================== GLOBAL SEARCH ===================
function openGlobalSearch(){ document.getElementById("globalSearchModal").style.display="flex"; }
function closeGlobalSearch(){ 
    document.getElementById("globalSearchModal").style.display="none"; 
    document.getElementById("globalSearchResults").innerHTML=""; 
}
function closeAppsModal(){ document.getElementById("appsModal").style.display="none"; }

async function runGlobalSearch(){
    const query=document.getElementById("globalSearchInput").value.trim();
    if(!query) return;

    const res=await fetch(`${API_BASE}/search/apps?name=${encodeURIComponent(query)}`);
    const data=await res.json();

    const clientMap={};
    data.forEach(d=>{
        if(!clientMap[d.uuid]) clientMap[d.uuid]={hostname:d.hostname, apps:[]};
        clientMap[d.uuid].apps.push(d);
    });

    let html="<table><tr><th>Hostname</th><th>UUID</th><th>Matches</th></tr>";
    for(let uuid in clientMap){
        const c=clientMap[uuid];
        html+=`<tr data-uuid="${uuid}"><td>${c.hostname}</td><td>${uuid}</td><td>${c.apps.length}</td></tr>`;
    }
    html+="</table>";
    if(Object.keys(clientMap).length===0) html="<p>No results found.</p>";
    document.getElementById("globalSearchResults").innerHTML=html;

    for(let uuid in clientMap){
        const row=document.querySelector(`#globalSearchResults tr[data-uuid='${uuid}']`);
        if(row) row.ondblclick=()=>showMatchingApps(uuid, query);
    }
}

// Show only matching apps in modal
async function showMatchingApps(uuid, searchQuery){
    const res = await fetch(`${API_BASE}/search/apps/${uuid}?name=${encodeURIComponent(searchQuery)}`);
    const apps = await res.json();

    let html="<table><tr><th>Name</th><th>Version</th><th>Install Date</th><th>Size</th></tr>";
    apps.forEach(a=>{
        html+=`<tr style="background:rgba(251,191,36,0.3)">
            <td>${a.name||""}</td>
            <td>${a.version||""}</td>
            <td>${a.install_date||""}</td>
            <td>${formatSize(a.size_bytes)}</td>
        </tr>`;
    });
    html+="</table>";

    document.getElementById("appsBody").innerHTML=html;
    document.getElementById("appsModal").style.display="flex";
}

// =================== EXPORT & DELETE ===================
function downloadPDF(uuid){ window.open(`/api/client/${uuid}/export/pdf`,"_blank"); }
function downloadCSV(uuid){ window.open(`/api/client/${uuid}/export/csv`,"_blank"); }
async function deleteClient(uuid){
    if(!confirm("Delete this client permanently?")) return;
    await fetch(`${API_BASE}/client/${uuid}`,{method:"DELETE"});
    loadClients();
}

// =================== INITIALIZATION ===================
checkRoute();
window.onpopstate=checkRoute;
</script>

</body>
</html>
