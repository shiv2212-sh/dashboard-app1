<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard</title>
<style>
  /* ================== General ================== */
  body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin:0; padding:0;
      background: #f4f6f8;
      color:#333;
      transition: background 0.3s, color 0.3s;
  }
  h1 { margin:0 0 20px 0; font-size:24px; }
  button { cursor:pointer; padding:5px 12px; border:none; border-radius:4px; }
  .primary { background:#1a73e8; color:#fff; }
  .secondary { background:#6c757d; color:#fff; }
  .danger { background:#dc3545; color:#fff; }

  /* ================== Container ================== */
  .container { max-width:1200px; margin:auto; padding:20px; }

  /* ================== Table ================== */
  table { width:100%; border-collapse:collapse; margin-bottom:20px; }
  th, td { padding:10px; text-align:left; border-bottom:1px solid #ddd; }
  th { background:#1a73e8; color:#fff; position: sticky; top:0; }
  tr:hover { background:#f1f1f1; }

  /* ================== Toolbar ================== */
  .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; flex-wrap:wrap; gap:10px; }
  .toolbar input, .toolbar select { padding:6px 10px; border-radius:4px; border:1px solid #ccc; }

  /* ================== Modal ================== */
  .modal-bg {
      position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,0.5); display:none; justify-content:center; align-items:center;
      z-index:1000;
  }
  .modal {
      background:#fff; padding:20px; border-radius:8px; max-width:800px; width:90%;
      max-height:90vh; overflow-y:auto; box-shadow:0 0 10px rgba(0,0,0,0.3);
  }
  .modal h2 { margin-top:0; }
  .modal-close { float:right; font-size:18px; font-weight:bold; background:none; border:none; cursor:pointer; }

  /* ================== Dark Mode ================== */
  body.dark { background:#121212; color:#e0e0e0; }
  body.dark table { border-color:#444; }
  body.dark th { background:#333; color:#fff; }
  body.dark tr:hover { background:#1f1f1f; }
  body.dark input, body.dark select { background:#1f1f1f; color:#e0e0e0; border:1px solid #555; }
</style>
</head>
<body>
<div class="container">
  <div class="toolbar">
      <h1>Client Dashboard</h1>
      <div>
        <input type="text" id="searchInput" placeholder="Search clients...">
        <select id="statusFilter">
          <option value="">All Status</option>
          <option value="Online">Online</option>
          <option value="Offline">Offline</option>
        </select>
        <button id="toggleDark" class="secondary">Dark Mode</button>
      </div>
  </div>

  <table id="clientsTable">
    <thead>
      <tr>
        <th>Hostname</th>
        <th>IP</th>
        <th>MAC</th>
        <th>Last Seen</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<!-- Client Details Modal -->
<div class="modal-bg" id="clientModal">
  <div class="modal">
      <button class="modal-close" onclick="closeModal('clientModal')">&times;</button>
      <h2 id="clientName"></h2>
      <p><b>IP:</b> <span id="clientIP"></span> | <b>MAC:</b> <span id="clientMAC"></span> | <b>Status:</b> <span id="clientStatus"></span></p>

      <h3>Hardware</h3>
      <table id="hardwareTable">
        <thead><tr><th>Key</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table>

      <h3>Apps</h3>
      <table id="appsTable">
        <thead><tr><th>Name</th><th>Version</th><th>Install Date</th><th>Size (MB)</th><th>History</th></tr></thead>
        <tbody></tbody>
      </table>

      <div style="margin-top:10px;">
        <button class="primary" onclick="exportPDF()">Export PDF</button>
        <button class="secondary" onclick="exportCSV()">Export CSV</button>
      </div>
  </div>
</div>

<!-- App History Modal -->
<div class="modal-bg" id="historyModal">
  <div class="modal">
      <button class="modal-close" onclick="closeModal('historyModal')">&times;</button>
      <h2>App History: <span id="historyAppName"></span></h2>
      <table id="historyTable">
        <thead><tr><th>Timestamp</th><th>Version</th><th>Install Date</th><th>Size (MB)</th></tr></thead>
        <tbody></tbody>
      </table>
  </div>
</div>

<script>
let clients = [];
let currentClientUUID = null;

// ================= Dark Mode =================
const darkToggle = document.getElementById('toggleDark');
darkToggle.onclick = () => {
    document.body.classList.toggle('dark');
}

// ================= Fetch Clients =================
async function fetchClients() {
    const res = await fetch("/api/clients");
    clients = await res.json();
    renderClients();
}

function renderClients() {
    const tbody = document.querySelector("#clientsTable tbody");
    tbody.innerHTML = "";
    const search = document.getElementById("searchInput").value.toLowerCase();
    const filter = document.getElementById("statusFilter").value;
    clients.forEach(c => {
        if ((c.hostname.toLowerCase().includes(search) || c.ip.includes(search)) &&
            (filter=="" || c.status==filter)) {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${c.hostname}</td>
                <td>${c.ip}</td>
                <td>${c.mac}</td>
                <td>${c.last_seen}</td>
                <td>${c.status}</td>
                <td><button class="primary" onclick="viewClient('${c.uuid}')">View</button></td>
            `;
            tbody.appendChild(tr);
        }
    });
}

document.getElementById("searchInput").addEventListener("input", renderClients);
document.getElementById("statusFilter").addEventListener("change", renderClients);

// ================= View Client =================
async function viewClient(uuid) {
    currentClientUUID = uuid;
    const res = await fetch(`/api/client/${uuid}`);
    const c = await res.json();

    document.getElementById("clientName").innerText = c.hostname;
    document.getElementById("clientIP").innerText = c.ip;
    document.getElementById("clientMAC").innerText = c.mac;
    document.getElementById("clientStatus").innerText = c.status;

    // Hardware
    const hwTbody = document.querySelector("#hardwareTable tbody");
    hwTbody.innerHTML = "";
    for (let k in c.hardware) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${k}</td><td>${c.hardware[k]}</td>`;
        hwTbody.appendChild(tr);
    }

    // Apps
    const appsTbody = document.querySelector("#appsTable tbody");
    appsTbody.innerHTML = "";
    c.apps.forEach(a=>{
        let sizeMB = 0;
        try { sizeMB = (parseInt(a.size_bytes)/1024/1024).toFixed(2); } catch{}
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${a.name}</td>
            <td>${a.version}</td>
            <td>${a.install_date}</td>
            <td>${sizeMB}</td>
            <td><button class="secondary" onclick="viewHistory('${a.name}')">History</button></td>
        `;
        appsTbody.appendChild(tr);
    });

    openModal('clientModal');
}

// ================= App History =================
async function viewHistory(appName) {
    const res = await fetch(`/api/client/${currentClientUUID}/history?app=${encodeURIComponent(appName)}`);
    const history = await res.json();

    document.getElementById("historyAppName").innerText = appName;
    const tbody = document.querySelector("#historyTable tbody");
    tbody.innerHTML = "";
    history.forEach(h=>{
        let sizeMB = 0;
        try { sizeMB = (parseInt(h.size_bytes)/1024/1024).toFixed(2); } catch{}
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${h.timestamp}</td><td>${h.version}</td><td>${h.install_date}</td><td>${sizeMB}</td>`;
        tbody.appendChild(tr);
    });
    openModal('historyModal');
}

// ================= Export =================
function exportPDF(){ window.open(`/api/client/${currentClientUUID}/pdf`); }
function exportCSV(){ window.open(`/api/client/${currentClientUUID}/csv`); }

// ================= Modal =================
function openModal(id){ document.getElementById(id).style.display='flex'; }
function closeModal(id){ document.getElementById(id).style.display='none'; }

// ================= Initial Load =================
fetchClients();
</script>
</body>
</html>
