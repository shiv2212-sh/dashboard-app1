<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise Client Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}
.container { padding:40px; }
h1,h2 { font-weight:600; }

.glass-card {
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    margin-bottom:25px;
}

.stats-grid {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:20px;
    margin-bottom:25px;
}

.stat-card { text-align:center; font-size:18px; }
.stat-number { font-size:28px; font-weight:bold; margin-top:10px; }

input {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
    margin-bottom:20px;
}

.app-search-container {
    margin: 20px 0;
}

.app-search-input {
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.1);
    color:white;
}

table { width:100%; border-collapse:collapse; }
th,td { padding:12px; text-align:left; }
tr { border-top:1px solid rgba(255,255,255,0.08); }
tr:hover { background:rgba(255,255,255,0.05); }

.status { padding:6px 12px; border-radius:20px; font-size:12px; font-weight:600; }
.online { background:rgba(16,185,129,0.2); color:#10b981; }
.offline { background:rgba(239,68,68,0.2); color:#ef4444; }

button {
    padding:6px 12px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:12px;
    margin-right:5px;
}

.view-btn { background:#3b82f6; color:white; }
.pdf-btn { background:#10b981; color:white; }
.csv-btn { background:#0ea5e9; color:white; }
.delete-btn { background:#ef4444; color:white; }
.back-btn { background:#64748b; color:white; margin-bottom:15px; }
.history-btn { background:#f59e0b; color:white; }

.hardware-grid {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.hardware-item {
    background:rgba(255,255,255,0.06);
    padding:15px;
    border-radius:12px;
}

.modal {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}

.modal-content {
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    width:80%;
    max-height:80%;
    overflow:auto;
}
</style>
</head>

<body>

<div class="container">
<h1 id="pageTitle">Enterprise Client Monitoring</h1>

<div id="dashboardView">
    <div class="stats-grid">
        <div class="glass-card stat-card">
            Total Clients
            <div class="stat-number" id="totalCount">0</div>
        </div>
        <div class="glass-card stat-card">
            Online
            <div class="stat-number" id="onlineCount">0</div>
        </div>
        <div class="glass-card stat-card">
            Offline
            <div class="stat-number" id="offlineCount">0</div>
        </div>
    </div>

    <!-- ================= ADDED: GLOBAL APP SEARCH ================= -->
    <div class="glass-card">
        <h2>Search Application Across All Clients</h2>
        <input type="text" id="globalAppSearchInput"
               placeholder="Enter app name and press Enter"
               onkeyup="if(event.key==='Enter') globalAppSearch()">

        <table id="globalAppResults" style="display:none;">
            <thead>
                <tr>
                    <th>Hostname</th>
                    <th>IP</th>
                    <th>Status</th>
                    <th>App Name</th>
                    <th>Version</th>
                    <th>Install Date</th>
                    <th>Size</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <!-- ================= END ADDED SECTION ================= -->

    <div class="glass-card">
        <input type="text" id="searchInput" placeholder="Search..." onkeyup="loadClients()">
        <table>
            <thead>
                <tr>
                    <th>UUID</th>
                    <th>Hostname</th>
                    <th>MAC</th>
                    <th>Last Seen</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="clientsTable"></tbody>
        </table>
    </div>
</div>

<div id="clientView" style="display:none;" class="glass-card">
    <button class="back-btn" onclick="goBack()">← Back</button>
    <div id="clientDetails"></div>
</div>
</div>

<div id="historyModal" class="modal">
    <div class="modal-content">
        <h3>App History</h3>
        <div id="historyBody"></div>
        <br>
        <button onclick="closeModal()">Close</button>
    </div>
</div>

<script>

const API_BASE="/api";
let currentUUID=null;

function formatSize(bytes){
    if(!bytes||bytes===0) return "0 MB";
    const mb=bytes/(1024*1024);
    return mb<1024?mb.toFixed(2)+" MB":(mb/1024).toFixed(2)+" GB";
}

/* ================= ADDED: GLOBAL SEARCH FUNCTION ================= */

async function globalAppSearch(){
    const query=document.getElementById("globalAppSearchInput").value;
    if(!query) return;

    const res=await fetch(`${API_BASE}/search/apps?query=${encodeURIComponent(query)}`);
    const data=await res.json();

    const table=document.getElementById("globalAppResults");
    const tbody=table.querySelector("tbody");
    tbody.innerHTML="";
    table.style.display="table";

    data.forEach(item=>{
        tbody.innerHTML+=`
        <tr>
            <td>${item.hostname}</td>
            <td>${item.ip}</td>
            <td><span class="status ${item.status==="Online"?"online":"offline"}">${item.status}</span></td>
            <td>${item.app_name}</td>
            <td>${item.version||""}</td>
            <td>${item.install_date||""}</td>
            <td>${formatSize(item.size_bytes)}</td>
        </tr>`;
    });
}

/* ================= END ADDED FUNCTION ================= */

/* ===== EVERYTHING BELOW IS YOUR ORIGINAL CODE UNCHANGED ===== */

function checkRoute(){
    const path=window.location.pathname;
    if(path.startsWith("/client/")){
        currentUUID=path.split("/client/")[1];
        showClientView();
    } else {
        showDashboardView();
    }
}

function showDashboardView(){
    document.getElementById("dashboardView").style.display="block";
    document.getElementById("clientView").style.display="none";
    document.getElementById("pageTitle").innerText="Enterprise Client Monitoring";
    loadClients();
}

/* ... YOUR ENTIRE ORIGINAL JS CONTINUES HERE EXACTLY ... */

checkRoute();
window.onpopstate=checkRoute;

</script>

</body>
</html>
