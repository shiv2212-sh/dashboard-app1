<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise Client Monitoring</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}
.container{ padding:30px; }

h1{ margin-bottom:20px; }

table{
    width:100%;
    border-collapse:collapse;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(8px);
    border-radius:10px;
    overflow:hidden;
}
th,td{
    padding:12px;
    border-bottom:1px solid rgba(255,255,255,0.1);
    text-align:left;
}
th{
    background:rgba(255,255,255,0.08);
}

button{
    padding:6px 12px;
    margin:2px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#3b82f6;
    color:white;
}
button:hover{ background:#2563eb; }

.status-online{ color:#22c55e; font-weight:bold; }
.status-offline{ color:#ef4444; font-weight:bold; }

#details{
    margin-top:30px;
    padding:20px;
    background:rgba(255,255,255,0.05);
    border-radius:10px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
}
.modal-content{
    background:#1e293b;
    margin:5% auto;
    padding:20px;
    width:70%;
    border-radius:10px;
    max-height:80%;
    overflow:auto;
}
.close{
    float:right;
    cursor:pointer;
    font-size:18px;
    color:#ef4444;
}
</style>
</head>

<body>

<div class="container">

<h1>Enterprise Client Dashboard</h1>

<table>
<tr>
<th>Hostname</th>
<th>IP</th>
<th>Status</th>
<th>Last Seen</th>
<th>Actions</th>
</tr>

{% for c in clients %}
<tr>
<td>{{c.hostname}}</td>
<td>{{c.ip}}</td>
<td>
{% if c.status == "Online" %}
<span class="status-online">Online</span>
{% else %}
<span class="status-offline">Offline</span>
{% endif %}
</td>
<td>{{c.last_seen}}</td>
<td>
<button onclick="viewClient('{{c.uuid}}')">View</button>
<a href="/export/pdf/{{c.uuid}}"><button>PDF</button></a>
<a href="/export/csv/{{c.uuid}}"><button>CSV</button></a>
</td>
</tr>
{% endfor %}
</table>

<div id="details"></div>

</div>

<!-- HISTORY MODAL -->
<div id="historyModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">✖</span>
    <div id="historyContent"></div>
  </div>
</div>

<script>

function formatSize(bytes, size_mb){
    if(bytes){
        return (bytes/(1024*1024)).toFixed(2) + " MB";
    }
    if(size_mb){
        return parseFloat(size_mb).toFixed(2) + " MB";
    }
    return "0 MB";
}

function viewClient(uuid){
    fetch("/view/"+uuid)
    .then(res=>res.json())
    .then(data=>{
        let html="<h2>Hardware Details</h2>";

        for(let key in data.hardware){
            html+="<b>"+key+":</b> "+data.hardware[key]+"<br>";
        }

        html+="<hr><h2>Installed Applications</h2>";
        html+="<table>";
        html+="<tr><th>Name</th><th>Version</th><th>Install Date</th><th>Size</th><th>History</th></tr>";

        data.apps.forEach(app=>{
            html+="<tr>";
            html+="<td>"+app.name+"</td>";
            html+="<td>"+app.version+"</td>";
            html+="<td>"+app.install_date+"</td>";
            html+="<td>"+formatSize(app.size_bytes, app.size_mb)+"</td>";
            html+="<td><button onclick=\"showHistory('"+uuid+"','"+app.name.replace(/'/g,"")+"')\">History</button></td>";
            html+="</tr>";
        });

        html+="</table>";
        document.getElementById("details").innerHTML=html;
    });
}

function showHistory(uuid, appName){
    fetch("/history/"+uuid+"/"+appName)
    .then(res=>res.json())
    .then(data=>{
        let html="<h3>History: "+appName+"</h3>";
        html+="<table>";
        html+="<tr><th>Version</th><th>Install Date</th><th>Size (MB)</th><th>Changed At</th></tr>";

        data.forEach(h=>{
            html+="<tr>";
            html+="<td>"+h.version+"</td>";
            html+="<td>"+h.install_date+"</td>";
            html+="<td>"+h.size_mb+" MB</td>";
            html+="<td>"+h.timestamp+"</td>";
            html+="</tr>";
        });

        html+="</table>";

        document.getElementById("historyContent").innerHTML=html;
        document.getElementById("historyModal").style.display="block";
    });
}

function closeModal(){
    document.getElementById("historyModal").style.display="none";
}

window.onclick=function(event){
    let modal=document.getElementById("historyModal");
    if(event.target==modal){
        modal.style.display="none";
    }
}

</script>

</body>
</html>
