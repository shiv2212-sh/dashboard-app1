<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Dashboard</title>
<style>
body.dark { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; }
body.light { background-color: #f0f0f0; color: #121212; font-family: Arial, sans-serif; }
.container { width: 90%; margin: 20px auto; }
h1 { text-align: center; }
.toolbar { margin-bottom: 15px; display: flex; justify-content: space-between; flex-wrap: wrap; gap:10px; }
.toolbar input[type="text"] { width: 200px; padding: 5px; border-radius: 4px; border: 1px solid #555; background-color: #1e1e1e; color: #e0e0e0; }
body.light .toolbar input[type="text"] { background-color: #fff; color: #121212; border: 1px solid #ccc; }
.toolbar button { padding: 5px 10px; border-radius: 4px; border: none; background-color: #3a3a3a; color: #fff; cursor: pointer; }
body.light .toolbar button { background-color: #e0e0e0; color: #121212; }
.toolbar button:hover { background-color: #555; }
body.light .toolbar button:hover { background-color: #ccc; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
table th, table td { padding: 8px; text-align: left; border: 1px solid #555; }
body.light table th, body.light table td { border: 1px solid #ccc; }
table th { background-color: #1e1e1e; }
body.light table th { background-color: #ddd; }
table tr:nth-child(even) { background-color: #1a1a1a; }
body.light table tr:nth-child(even) { background-color: #f5f5f5; }
table tr:hover { background-color: #333; }
body.light table tr:hover { background-color: #ccc; }
button.view-btn { padding: 3px 6px; margin-right: 5px; border: none; border-radius: 3px; cursor: pointer; background-color: #007bff; color: #fff; }
button.view-btn:hover { background-color: #0056b3; }
a.pdf-link { color: #ff9800; text-decoration: none; }
a.pdf-link:hover { text-decoration: underline; }
#detail-view { display: none; margin-top: 20px; }
#detail-view h2 { margin-bottom: 10px; }
#detail-view table { margin-top: 10px; }
#app-search { width: 300px; padding: 5px; margin: 10px 0; border-radius: 4px; border: 1px solid #555; background-color: #1e1e1e; color: #e0e0e0; }
body.light #app-search { background-color: #fff; color: #121212; border: 1px solid #ccc; }
</style>
</head>
<body class="dark">
<div class="container">

<div id="main-dashboard">
<h1>Client Monitoring Dashboard</h1>
<div class="toolbar">
<input type="text" id="search" placeholder="Search clients...">
<div>
<button onclick="exportCSV()">Export CSV</button>
<button id="toggle-theme">Toggle Dark/Light</button>
</div>
</div>

<table>
<thead>
<tr>
<th>UUID</th>
<th>MAC</th>
<th>Hostname</th>
<th>IP</th>
<th>Last Seen</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="clients-body"></tbody>
</table>
</div>

<div id="detail-view">
<h2>Client Details</h2>
<div class="toolbar">

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Dashboard</title>
<style>
    body.dark { background-color: #121212; color: #e0e0e0; font-family: Arial, sans-serif; }
    body.light { background-color: #f0f0f0; color: #121212; font-family: Arial, sans-serif; }
    .container { width: 90%; margin: 20px auto; }
    h1 { text-align: center; }
    .toolbar { margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap:10px; }
    .toolbar input[type="text"] { width: 200px; padding: 5px; border-radius: 4px; border: 1px solid #555; background-color: #1e1e1e; color: #e0e0e0; }
    body.light .toolbar input[type="text"] { background-color: #fff; color: #121212; border: 1px solid #ccc; }
    .toolbar button { padding: 5px 10px; border-radius: 4px; border: none; background-color: #3a3a3a; color: #fff; cursor: pointer; }
    body.light .toolbar button { background-color: #e0e0e0; color: #121212; }
    .toolbar button:hover { background-color: #555; }
    body.light .toolbar button:hover { background-color: #ccc; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table th, table td { padding: 8px; text-align: left; border: 1px solid #555; }
    body.light table th, body.light table td { border: 1px solid #ccc; }
    table th { background-color: #1e1e1e; }
    body.light table th { background-color: #ddd; }
    table tr:nth-child(even) { background-color: #1a1a1a; }
    body.light table tr:nth-child(even) { background-color: #f5f5f5; }
    table tr:hover { background-color: #333; }
    body.light table tr:hover { background-color: #ccc; }
    button.view-btn { padding: 3px 6px; margin-right: 5px; border: none; border-radius: 3px; cursor: pointer; background-color: #007bff; color: #fff; }
    button.view-btn:hover { background-color: #0056b3; }
    a.pdf-link { color: #ff9800; text-decoration: none; }
    a.pdf-link:hover { text-decoration: underline; }
    #detail-view { display: none; margin-top: 20px; }
    #detail-view h2 { margin-bottom: 10px; }
    #detail-view table { margin-top: 10px; }
    #app-search { width: 300px; padding: 5px; margin: 10px 0; border-radius: 4px; border: 1px solid #555; background-color: #1e1e1e; color: #e0e0e0; }
    body.light #app-search { background-color: #fff; color: #121212; border: 1px solid #ccc; }
</style>
</head>
<body class="dark">
<div class="container">

    <!-- MAIN DASHBOARD -->
    <div id="main-dashboard">
        <h1>Client Monitoring Dashboard</h1>
        <div class="toolbar">
            <input type="text" id="search" placeholder="Search clients...">
            <div>
                <button onclick="exportCSV()">Export CSV</button>
                <button id="toggle-theme">Toggle Dark/Light</button>
            </div>
        </div>

        <table>
            <thead>
            <tr>
                <th>UUID</th>
                <th>MAC</th>
                <th>Hostname</th>
                <th>IP</th>
                <th>Last Seen</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="clients-body"></tbody>
        </table>
    </div>

    <!-- CLIENT DETAIL VIEW -->
    <div id="detail-view">
        <h2>Client Details</h2>
        <div class="toolbar">
            <button onclick="backToDashboard()">Back</button>
            <button onclick="goHome()">Home</button>
            <a href="#" id="pdf-link" target="_blank">Export PDF</a>
            <button id="toggle-theme-detail">Toggle Dark/Light</button>
        </div>

        <h3>Hardware Info</h3>
        <table>
            <tbody id="hardware-body"></tbody>
        </table>

        <h3>Installed Applications</h3>
        <input type="text" id="app-search" placeholder="Search installed apps...">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Version</th>
                <th>Size</th>
                <th>Install Date</th>
                <th>History</th>
            </tr>
            </thead>
            <tbody id="apps-body"></tbody>
        </table>
    </div>

</div>

<script>
async function loadClients(search = "") {
    try {
        const res = await fetch(`/api/clients?search=${encodeURIComponent(search)}`);
        const data = await res.json();
        const tbody = document.getElementById("clients-body");
        tbody.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No clients found</td></tr>`;
            return;
        }

        data.forEach(c => {
            const uuid = c.uuid || c.client_id || "";
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${uuid}</td>
                <td>${c.mac || "N/A"}</td>
                <td>${c.hostname || "N/A"}</td>
                <td>${c.ip || c.ip_address || "N/A"}</td>
                <td>${c.last_seen || "N/A"}</td>
                <td>${c.status || "Unknown"}</td>
                <td>
                    <button class="view-btn" onclick="viewClient('${uuid}')">View</button>
                    <a class="pdf-link" href="/export/pdf/${uuid}" target="_blank">PDF</a>
                </td>
            `;
            tbody.appendChild(tr);
        });

    } catch (err) {
        console.error("Error loading clients:", err);
    }
}

function exportCSV() {
    window.location.href = "/export/csv";
}

async function viewClient(uuid) {
    try {
        const res = await fetch(`/api/client/${uuid}`);
        const data = await res.json();

        if (!data || data.error) {
            alert(data?.error || "Failed to load client details");
            return;
        }

        document.getElementById("main-dashboard").style.display = "none";
        document.getElementById("detail-view").style.display = "block";

        // Hardware
        const hardware = data.hardware || data.hardware_info || {};
        const hardwareBody = document.getElementById("hardware-body");
        hardwareBody.innerHTML = "";

        Object.entries(hardware).forEach(([key, value]) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<th>${key}</th><td>${value}</td>`;
            hardwareBody.appendChild(tr);
        });

        // Apps
        const apps = data.apps || data.installed_apps || [];
        const appsBody = document.getElementById("apps-body");
        appsBody.innerHTML = "";

        apps.forEach(app => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${app.name || "N/A"}</td>
                <td>${app.version || "N/A"}</td>
                <td>${app.size || app.disk_size || "N/A"}</td>
                <td>${app.install_date || data.last_seen || "N/A"}</td>
                <td>
                    <button class="view-btn" onclick='showAppHistory("${app.name || "App"}")'>
                        History
                    </button>
                </td>
            `;
            appsBody.appendChild(tr);
        });

        document.getElementById("pdf-link").href = `/export/pdf/${uuid}`;

        const appSearch = document.getElementById("app-search");
        appSearch.value = "";
        appSearch.oninput = () => {
            const query = appSearch.value.toLowerCase();
            const rows = document.querySelectorAll("#apps-body tr");
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(query) ? "" : "none";
            });
        };

    } catch (err) {
        console.error("Error viewing client:", err);
    }
}

function showAppHistory(appName) {
    alert(`History for ${appName} feature ready.`);
}

function backToDashboard() {
    document.getElementById("detail-view").style.display = "none";
    document.getElementById("main-dashboard").style.display = "block";
}

function goHome() {
    backToDashboard();
}

function toggleTheme() {
    const body = document.body;
    body.classList.toggle("dark");
    body.classList.toggle("light");
}

document.addEventListener("DOMContentLoaded", () => {
    loadClients();
    document.getElementById("search").addEventListener("input", (e) => loadClients(e.target.value));
    setInterval(() => loadClients(document.getElementById("search").value), 15000);

    document.getElementById("toggle-theme").addEventListener("click", toggleTheme);
    document.getElementById("toggle-theme-detail").addEventListener("click", toggleTheme);
});
</script>
</body>
</html>
