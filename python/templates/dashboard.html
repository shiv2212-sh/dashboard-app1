<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Monitoring Dashboard</title>
<style>
/* ---------------- GENERAL ---------------- */
body{
    margin:0;
    font-family:"Segoe UI",Arial,sans-serif;
    background:#f4f6f9;
    color:#111;
}
.dark{
    background:#1e1e1e;
    color:#eee;
}
header{
    background:#1f2937;
    color:white;
    padding:15px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
header h2{margin:0; font-size: 22px;}

.container{padding:30px; max-width:1200px; margin:auto;}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.08);
    margin-bottom:20px;
}
.dark .card{background:#2b2b2b;}

table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:12px;
    text-align:left;
}
th{
    background:#111827;
    color:white;
}
.dark th{background:#000;}
tr:nth-child(even){background:#f9fafb;}
.dark tr:nth-child(even){background:#333;}
tr:hover{background:#e2e8f0; cursor:pointer;}
.dark tr:hover{background:#3b3b3b;}

button{
    padding:6px 12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:13px;
    margin-right:5px;
}
.btn-view{background:#2563eb;color:white;}
.btn-delete{background:#dc2626;color:white;}
.btn-refresh{background:#10b981;color:white;}
.btn-back{background:#6b7280;color:white;}
.btn-pdf{background:#9333ea;color:white;}
.btn-history{background:#f59e0b;color:white;}

.search-box{
    margin-bottom:15px;
    padding:8px;
    width:300px;
    border-radius:6px;
    border:1px solid #ccc;
}
.dark .search-box{
    background:#333;
    color:white;
    border:1px solid #555;
}

.status-online{color:#16a34a;font-weight:bold;}
.status-offline{color:#dc2626;font-weight:bold;}

.section-title{
    font-weight:bold;
    margin-top:20px;
    margin-bottom:10px;
    font-size:16px;
}

/* ---------------- MODAL ---------------- */
.modal{
    display:none;
    position:fixed;
    z-index:1000;
    left:0;top:0;width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    justify-content:center;align-items:center;
}
.modal-content{
    background:white;
    padding:20px;
    border-radius:8px;
    max-width:800px;
    width:90%;
    max-height:80%;
    overflow-y:auto;
}
.dark .modal-content{background:#2b2b2b;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.modal-header h3{margin:0;}
.modal-close{cursor:pointer;font-weight:bold;font-size:20px;}
</style>
</head>
<body>

<header>
    <h2>Client Monitoring Dashboard</h2>
    <div>
        <button class="btn-refresh" onclick="manualRefresh()">Refresh</button>
        <button onclick="toggleDark()">Dark Mode</button>
    </div>
</header>

<div class="container">

<!-- ================= CLIENT LIST PAGE ================= -->
<div id="clientListPage">

<div class="card">
<input type="text" id="searchInput" class="search-box"
placeholder="Search UUID, Hostname, IP, Status..."
onkeyup="filterClients()">

<table id="clientsTable">
<thead>
<tr>
<th>UUID</th>
<th>Hostname</th>
<th>IP</th>
<th>Status</th>
<th>Last Seen</th>
<th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

</div>
</div>

<!-- ================= CLIENT DETAIL PAGE ================= -->
<div id="clientDetailPage" style="display:none;">

<div style="margin-bottom:10px;">
<button class="btn-back" onclick="goBack()">Back</button>
<button class="btn-pdf" onclick="downloadPDF()">Export PDF</button>
</div>

<div class="card" id="clientInfo"></div>

<div class="card">
<div class="section-title">Hardware Information</div>
<div id="hardwareSection"></div>
</div>

<div class="card">
<div class="section-title">Installed Applications</div>
<input type="text" id="appSearch" class="search-box"
placeholder="Search App..."
onkeyup="filterApps()">
<div id="appsSection"></div>
</div>

</div>

<!-- ================= APP HISTORY MODAL ================= -->
<div id="historyModal" class="modal">
<div class="modal-content">
    <div class="modal-header">
        <h3>App History</h3>
        <span class="modal-close" onclick="closeModal()">×</span>
    </div>
    <div id="historyContent"></div>
</div>
</div>

<script>
let allClients = [];
let currentUUID = "";
let currentApps = [];

// ---------------- DARK MODE ----------------
function toggleDark(){
    document.body.classList.toggle("dark");
}

// ---------------- CLIENT LIST ----------------
async function loadClients(){
    const res = await fetch("/api/clients");
    const data = await res.json();
    allClients = data;

    const tbody = document.querySelector("#clientsTable tbody");
    tbody.innerHTML = "";

    data.forEach(c=>{
        const row = `
        <tr>
            <td>${c.uuid}</td>
            <td>${c.hostname}</td>
            <td>${c.ip}</td>
            <td class="${c.status==='Online'?'status-online':'status-offline'}">${c.status}</td>
            <td>${c.last_seen}</td>
            <td>
                <button class="btn-view" onclick="viewClient('${c.uuid}')">View</button>
                <button class="btn-delete" onclick="deleteClient('${c.uuid}')">Delete</button>
            </td>
        </tr>`;
        tbody.innerHTML += row;
    });
}

function filterClients(){
    const search = document.getElementById("searchInput").value.toLowerCase();
    const rows = document.querySelectorAll("#clientsTable tbody tr");
    rows.forEach(r=>{
        r.style.display = r.innerText.toLowerCase().includes(search) ? "" : "none";
    });
}

// ---------------- CLIENT DETAIL ----------------
async function viewClient(uuid){
    currentUUID = uuid;
    const res = await fetch("/api/client/"+uuid);
    const data = await res.json();

    document.getElementById("clientListPage").style.display="none";
    document.getElementById("clientDetailPage").style.display="block";

    document.getElementById("clientInfo").innerHTML = `
        <b>UUID:</b> ${data.uuid}<br>
        <b>Hostname:</b> ${data.hostname}<br>
        <b>IP:</b> ${data.ip}<br>
        <b>Status:</b> ${data.status}<br>
        <b>Last Seen:</b> ${data.last_seen}
    `;

    // Hardware
    let hwHTML = "";
    const hw = data.hardware || {};
    for(let key in hw){
        if(key !== "Disks"){
            hwHTML += `<b>${key}:</b> ${hw[key]}<br>`;
        }
    }
    if(hw.Disks){
        hwHTML += "<br><b>Disks:</b><br>";
        hw.Disks.forEach(d=>{
            hwHTML += `
            ${d.Device || d.Mountpoint}
            (Total: ${d["Total (GB)"]} GB,
            Used: ${d["Used (GB)"]} GB,
            Free: ${d["Free (GB)"]} GB)
            <br>`;
        });
    }
    document.getElementById("hardwareSection").innerHTML = hwHTML;

    // Apps
    currentApps = data.apps || [];
    renderApps(currentApps);
}

function renderApps(apps){
    let html = `<table>
        <tr><th>Name</th><th>Version</th><th>Install Date</th><th>Size (MB)</th><th>History</th></tr>`;
    apps.forEach(a=>{
        let size = Number(a.size_bytes || 0)/ (1024*1024);
        html += `<tr>
            <td>${a.name}</td>
            <td>${a.version}</td>
            <td>${a.install_date}</td>
            <td>${size.toFixed(2)}</td>
            <td><button class="btn-history" onclick="viewHistory('${a.name}')">History</button></td>
        </tr>`;
    });
    html += "</table>";
    document.getElementById("appsSection").innerHTML = html;
}

function filterApps(){
    const search = document.getElementById("appSearch").value.toLowerCase();
    const filtered = currentApps.filter(a =>
        a.name.toLowerCase().includes(search)
    );
    renderApps(filtered);
}

function goBack(){
    document.getElementById("clientDetailPage").style.display="none";
    document.getElementById("clientListPage").style.display="block";
}

function deleteClient(uuid){
    if(confirm("Delete this client?")){
        fetch("/api/client/"+uuid,{method:"DELETE"})
        .then(()=>loadClients());
    }
}

// ---------------- PDF ----------------
function downloadPDF(){
    window.location="/api/client/"+currentUUID+"/pdf";
}

// ---------------- APP HISTORY ----------------
async function viewHistory(appName){
    const res = await fetch(`/api/client/${currentUUID}/history?app=${encodeURIComponent(appName)}`);
    const data = await res.json();

    let html = `<table style="width:100%; border-collapse:collapse;">
        <tr><th>Timestamp</th><th>Name</th><th>Version</th><th>Install Date</th><th>Size (MB)</th></tr>`;
    data.forEach(entry=>{
        entry.apps.forEach(a=>{
            if(a.name===appName){
                let size = Number(a.size_bytes || 0)/ (1024*1024);
                html += `<tr>
                    <td>${entry.timestamp}</td>
                    <td>${a.name}</td>
                    <td>${a.version}</td>
                    <td>${a.install_date}</td>
                    <td>${size.toFixed(2)}</td>
                </tr>`;
            }
        });
    });
    html += "</table>";

    document.getElementById("historyContent").innerHTML = html;
    document.getElementById("historyModal").style.display = "flex";
}

function closeModal(){
    document.getElementById("historyModal").style.display = "none";
}

// ---------------- AUTO REFRESH ----------------
setInterval(()=>{
    if(document.getElementById("clientListPage").style.display!=="none"){
        loadClients();
    }
},10000);

function manualRefresh(){loadClients();}

loadClients();
</script>
</body>
</html>
