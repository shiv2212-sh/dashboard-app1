<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise Client Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}

.container { padding:30px; }

h1 { margin-bottom:20px; }

.card {
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 4px 20px rgba(0,0,0,0.4);
}

input {
    padding:10px;
    border-radius:8px;
    border:none;
    width:250px;
    margin-right:10px;
}

button {
    padding:8px 14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

.btn-primary { background:#3b82f6; color:white; }
.btn-danger { background:#ef4444; color:white; }
.btn-secondary { background:#475569; color:white; }

table {
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}

th, td {
    padding:10px;
    border-bottom:1px solid #334155;
    text-align:left;
}

.status-online { color:#22c55e; font-weight:bold; }
.status-offline { color:#ef4444; font-weight:bold; }

.section-title {
    margin-top:25px;
    margin-bottom:10px;
    font-size:18px;
    font-weight:600;
}

.hidden { display:none; }
.small { font-size:13px; opacity:0.8; }

/* MODAL STYLING */
.modal {
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-content {
    background:#1e293b;
    padding:25px;
    border-radius:14px;
    width:80%;
    max-height:80%;
    overflow-y:auto;
    box-shadow:0 0 30px rgba(0,0,0,0.6);
}

.close-btn {
    float:right;
    cursor:pointer;
    font-weight:bold;
    font-size:18px;
}

</style>
</head>
<body>

<div class="container">

<h1>Enterprise Client Monitoring Dashboard</h1>

<!-- GLOBAL SEARCH BUTTON -->
<div style="margin-bottom:20px;">
    <button class="btn-primary" onclick="openSearchModal()">Global App Search</button>
</div>

<!-- CLIENT SEARCH -->
<div class="card">
    <h2>Search Clients</h2>
    <input type="text" id="clientSearch" placeholder="Search hostname / UUID / MAC">
    <button class="btn-primary" onclick="loadClients()">Search</button>
</div>

<!-- CLIENT LIST -->
<div class="card">
    <h2>Clients</h2>
    <div id="clientList"></div>
</div>

<!-- CLIENT DETAILS -->
<div class="card hidden" id="clientDetailsCard">
    <h2>Client Details</h2>
    <div id="clientDetails"></div>
</div>

</div>

<!-- GLOBAL SEARCH MODAL -->
<div class="modal" id="searchModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeSearchModal()">✖</span>
        <h2>Global Application Search</h2>

        <input type="text" id="appSearch" placeholder="Enter app name">
        <button class="btn-primary" onclick="searchApps()">Search</button>

        <div id="appResults"></div>
    </div>
</div>

<script>

function formatMB(bytes){
    if(!bytes) return "0 MB";
    return (bytes / (1024*1024)).toFixed(2) + " MB";
}

function loadClients(){
    let search = document.getElementById("clientSearch").value;

    fetch("/api/clients?search=" + search)
    .then(res => res.json())
    .then(data => {

        let html = `
        <table>
            <tr>
                <th>Hostname</th>
                <th>UUID</th>
                <th>MAC</th>
                <th>Last Seen</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>`;

        data.forEach(client => {
            html += `
            <tr>
                <td>${client.hostname}</td>
                <td class="small">${client.uuid}</td>
                <td>${client.mac}</td>
                <td>${client.last_seen}</td>
                <td class="${client.status === "Online" ? "status-online" : "status-offline"}">
                    ${client.status}
                </td>
                <td>
                    <button class="btn-secondary" onclick="viewClient('${client.uuid}')">View</button>
                    <button class="btn-danger" onclick="deleteClient('${client.uuid}')">Delete</button>
                </td>
            </tr>`;
        });

        html += "</table>";

        document.getElementById("clientList").innerHTML = html;
    });
}

function viewClient(uuid){
    fetch("/api/client/" + uuid)
    .then(res => res.json())
    .then(data => {

        let html = `
        <p><strong>Hostname:</strong> ${data.hostname}</p>
        <p><strong>IP:</strong> ${data.ip}</p>
        <p><strong>MAC:</strong> ${data.mac}</p>
        <p><strong>Last Seen:</strong> ${data.last_seen}</p>

        <div class="section-title">Hardware Info</div>
        <pre>${JSON.stringify(data.hardware, null, 2)}</pre>

        <div class="section-title">Installed Applications</div>
        <table>
            <tr>
                <th>Name</th>
                <th>Version</th>
                <th>Install Date</th>
                <th>Disk Usage</th>
            </tr>`;

        data.apps.forEach(app => {
            html += `
            <tr>
                <td>${app.name}</td>
                <td>${app.version}</td>
                <td>${app.install_date}</td>
                <td>${formatMB(app.size_bytes)}</td>
            </tr>`;
        });

        html += "</table>";

        document.getElementById("clientDetails").innerHTML = html;
        document.getElementById("clientDetailsCard").classList.remove("hidden");
    });
}

function deleteClient(uuid){
    if(!confirm("Delete this client?")) return;
    fetch("/api/client/" + uuid, {method:"DELETE"})
    .then(() => loadClients());
}

function openSearchModal(){
    document.getElementById("searchModal").style.display = "flex";
}

function closeSearchModal(){
    document.getElementById("searchModal").style.display = "none";
}

function searchApps(){
    let query = document.getElementById("appSearch").value;

    fetch("/api/search/apps?query=" + query)
    .then(res => res.json())
    .then(data => {

        if(data.length === 0){
            document.getElementById("appResults").innerHTML = "<p>No results found.</p>";
            return;
        }

        let html = `
        <table>
            <tr>
                <th>Hostname</th>
                <th>App</th>
                <th>Version</th>
                <th>Install Date</th>
                <th>Disk Usage</th>
                <th>Status</th>
            </tr>`;

        data.forEach(item => {
            html += `
            <tr>
                <td>${item.hostname}</td>
                <td>${item.app_name}</td>
                <td>${item.version}</td>
                <td>${item.install_date}</td>
                <td>${formatMB(item.size_bytes)}</td>
                <td class="${item.status === "Online" ? "status-online" : "status-offline"}">
                    ${item.status}
                </td>
            </tr>`;
        });

        html += "</table>";

        document.getElementById("appResults").innerHTML = html;
    });
}

loadClients();

</script>

</body>
</html>
