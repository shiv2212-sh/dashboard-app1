<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    margin: 0;
    padding: 20px;
}

h2 {
    margin-bottom: 20px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background-color: #2c3e50;
    color: white;
}

tr:hover {
    background-color: #f1f1f1;
}

button {
    padding: 6px 10px;
    margin: 2px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
}

.view-btn { background: #3498db; color: white; }
.pdf-btn { background: #2ecc71; color: white; }
.history-btn { background: #f39c12; color: white; }
.delete-btn { background: #e74c3c; color: white; }

.status-online {
    color: green;
    font-weight: bold;
}

.status-offline {
    color: red;
    font-weight: bold;
}
</style>
</head>

<body>

<h2>Client Management Dashboard</h2>

<table>
    <thead>
        <tr>
            <th>Hostname</th>
            <th>IP</th>
            <th>MAC</th>
            <th>Last Seen</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="clientTable"></tbody>
</table>

<script>

function loadClients() {
    fetch('/api/clients')
    .then(res => res.json())
    .then(data => {
        let html = "";

        data.forEach(c => {
            let statusClass = c.status === "Online" ? "status-online" : "status-offline";

            html += `
            <tr>
                <td>${c.hostname}</td>
                <td>${c.ip}</td>
                <td>${c.mac}</td>
                <td>${c.last_seen}</td>
                <td class="${statusClass}">${c.status}</td>
                <td>
                    <button class="view-btn" onclick="navigateClient('${c.uuid}')">View</button>
                    <button class="pdf-btn" onclick="downloadPDF('${c.uuid}')">PDF</button>
                    <button class="history-btn" onclick="downloadCSV('${c.uuid}')">CSV</button>
                    <button class="delete-btn" onclick="deleteClient('${c.uuid}')">Delete</button>
                </td>
            </tr>
            `;
        });

        document.getElementById("clientTable").innerHTML = html;
    });
}

function navigateClient(uuid){
    alert("Client UUID: " + uuid);
}

function downloadPDF(uuid){
    window.open(`/api/client/${uuid}/pdf`, "_blank");
}

function downloadCSV(uuid){
    window.open(`/api/client/${uuid}/csv`, "_blank");
}

function deleteClient(uuid){
    if(!confirm("Are you sure you want to delete this client?")) return;

    fetch(`/api/client/${uuid}`, {
        method: "DELETE"
    })
    .then(res => res.json())
    .then(() => loadClients());
}

// Auto refresh every 10 seconds
setInterval(loadClients, 10000);

loadClients();

</script>

</body>
</html>
