<!DOCTYPE html>
<html>
<head>
    <title>Client Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 30px;
        }

        .glass-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.1);
            color: white;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 12px;
            font-weight: 500;
            opacity: 0.8;
        }

        td {
            padding: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        tr:hover {
            background: rgba(255,255,255,0.05);
            transition: 0.2s;
        }

        .status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .online {
            background: rgba(16,185,129,0.2);
            color: #10b981;
        }

        .offline {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
        }

        button {
            padding: 6px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            margin-right: 5px;
            font-size: 12px;
        }

        .view-btn { background: #3b82f6; color: white; }
        .pdf-btn { background: #10b981; color: white; }
        .delete-btn { background: #ef4444; color: white; }

        #clientDetail { display: none; }

        .back-btn {
            margin-bottom: 20px;
            background: #64748b;
            color: white;
        }

        .section-title {
            margin-top: 30px;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 18px;
        }

        .hardware-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px,1fr));
            gap: 15px;
        }

        .hardware-item {
            background: rgba(255,255,255,0.06);
            padding: 15px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="container">

<h1>Client Monitoring Dashboard</h1>

<div id="clientList" class="glass-card">
    <input type="text" id="dashboardSearch" placeholder="Search by UUID, Hostname, IP or Status..." onkeyup="filterClients()">

    <table>
        <thead>
            <tr>
                <th>UUID</th>
                <th>Hostname</th>
                <th>IP</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="clientTable"></tbody>
    </table>
</div>

<div id="clientDetail" class="glass-card">

    <button class="back-btn" onclick="goBack()">← Back</button>

    <h2 id="detailHostname"></h2>

    <div class="section-title">System Info</div>
    <div id="basicInfo"></div>

    <div class="section-title">Hardware Information</div>
    <div id="hardwareInfo" class="hardware-grid"></div>

    <input type="text" id="appSearch" placeholder="Search installed applications..." onkeyup="filterApps()">

    <div class="section-title">Installed Applications</div>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Version</th>
                <th>Install Date</th>
                <th>Size (MB)</th>
            </tr>
        </thead>
        <tbody id="appsTable"></tbody>
    </table>

</div>

</div>

<script>

let allClients = [];
let currentApps = [];

function formatMB(bytes) {
    if (!bytes) return "0";
    return (bytes / (1024 * 1024)).toFixed(2);
}

function loadClients() {
    fetch("/api/clients")
        .then(res => res.json())
        .then(data => {
            allClients = data;
            renderClients(data);
        });
}

function renderClients(data) {
    const table = document.getElementById("clientTable");
    table.innerHTML = "";

    data.forEach(client => {
        table.innerHTML += `
            <tr>
                <td>${client.uuid}</td>
                <td>${client.hostname}</td>
                <td>${client.ip}</td>
                <td>
                    <span class="status ${client.status === "Online" ? "online" : "offline"}">
                        ${client.status}
                    </span>
                </td>
                <td>
                    <button class="view-btn" onclick="viewClient('${client.uuid}')">View</button>
                    <button class="pdf-btn" onclick="downloadPDF('${client.uuid}')">PDF</button>
                    <button class="delete-btn" onclick="deleteClient('${client.uuid}')">Delete</button>
                </td>
            </tr>
        `;
    });
}

function filterClients() {
    const search = document.getElementById("dashboardSearch").value.toLowerCase();

    const filtered = allClients.filter(c =>
        (c.uuid || "").toLowerCase().includes(search) ||
        (c.hostname || "").toLowerCase().includes(search) ||
        (c.ip || "").toLowerCase().includes(search) ||
        (c.status || "").toLowerCase().includes(search)
    );

    renderClients(filtered);
}

function viewClient(uuid) {
    fetch(`/api/client/${uuid}`)
        .then(res => res.json())
        .then(client => {

            document.getElementById("clientList").style.display = "none";
            document.getElementById("clientDetail").style.display = "block";

            document.getElementById("detailHostname").innerText = client.hostname;

            document.getElementById("basicInfo").innerHTML = `
                <p><b>UUID:</b> ${client.uuid}</p>
                <p><b>IP:</b> ${client.ip}</p>
                <p><b>MAC:</b> ${client.mac}</p>
                <p><b>Last Seen:</b> ${client.last_seen}</p>
            `;

            const hwDiv = document.getElementById("hardwareInfo");
            hwDiv.innerHTML = "";

            for (let key in client.hardware) {
                if (key !== "Disks") {
                    hwDiv.innerHTML += `
                        <div class="hardware-item">
                            <b>${key}</b><br>${client.hardware[key]}
                        </div>
                    `;
                }
            }

            currentApps = client.apps;
            renderApps(client.apps);
        });
}

function renderApps(apps) {
    const appsTable = document.getElementById("appsTable");
    appsTable.innerHTML = "";

    apps.forEach(app => {
        appsTable.innerHTML += `
            <tr>
                <td>${app.name}</td>
                <td>${app.version}</td>
                <td>${app.install_date}</td>
                <td>${formatMB(app.size_bytes)} MB</td>
            </tr>
        `;
    });
}

function filterApps() {
    const search = document.getElementById("appSearch").value.toLowerCase();

    const filtered = currentApps.filter(app =>
        (app.name || "").toLowerCase().includes(search) ||
        (app.version || "").toLowerCase().includes(search)
    );

    renderApps(filtered);
}

function downloadPDF(uuid) {
    window.open(`/api/client/${uuid}/pdf`, "_blank");
}

function deleteClient(uuid) {
    if (!confirm("Delete this client?")) return;
    fetch(`/api/client/${uuid}`, { method: "DELETE" })
        .then(() => loadClients());
}

function goBack() {
    document.getElementById("clientDetail").style.display = "none";
    document.getElementById("clientList").style.display = "block";
}

loadClients();

</script>

</body>
</html>
