<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Dashboard</title>
<style>
body { font-family: Arial, sans-serif; background:#f0f2f5; margin:20px; }
table { width:100%; border-collapse: collapse; margin-top:10px; }
th, td { border:1px solid #ccc; padding:8px; text-align:left; }
th { background:#333; color:white; }
.status-online { color: green; font-weight:bold; }
.status-offline { color: red; font-weight:bold; }
input { padding:6px; margin:6px 0; width:300px; }
button { padding:6px 12px; }
.popup {
    display:none; position:fixed; top:50%; left:50%;
    transform:translate(-50%, -50%);
    background:white; padding:20px; border:2px solid #333;
    max-height:80%; overflow:auto; z-index:1000;
}
.popup table { width:100%; }
.popup-close { cursor:pointer; color:red; float:right; font-weight:bold; }
.overlay {
    display:none; position:fixed; top:0; left:0;
    width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999;
}
</style>
</head>
<body>

<h1>Client Dashboard</h1>

<input type="text" id="appSearch" placeholder="Search apps globally (optional)">
<button onclick="searchApps()">Search</button>

<table id="clientTable">
<thead>
<tr>
<th>Hostname</th>
<th>UUID</th>
<th>IP</th>
<th>MAC</th>
<th>Last Seen</th>
<th>Status</th>
<th>Matching Apps</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
    <span class="popup-close" onclick="closePopup()">X</span>
    <h3 id="popupTitle">Matched Apps</h3>
    <table id="popupTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Version</th>
                <th>Install Date</th>
                <th>Size</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// ================= Load all clients =================
async function loadClients() {
    const res = await fetch("/api/clients");
    const clients = await res.json();

    const tbody = document.querySelector("#clientTable tbody");
    tbody.innerHTML = "";

    for (const c of clients) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${c.hostname}</td>
            <td>${c.uuid}</td>
            <td>${c.ip}</td>
            <td>${c.mac}</td>
            <td>${c.last_seen}</td>
            <td class="status-${c.status.toLowerCase()}">${c.status}</td>
            <td id="matches-${c.uuid}">-</td>
        `;
        tbody.appendChild(tr);
    }
}

// ================= Global App Search =================
async function searchApps() {
    const name = document.querySelector("#appSearch").value.trim();
    if (!name) {
        // reset matches
        document.querySelectorAll("[id^='matches-']").forEach(td => td.textContent = "-");
        return;
    }

    const res = await fetch(`/api/search/apps?name=${encodeURIComponent(name)}`);
    const data = await res.json();

    // Reset all first
    document.querySelectorAll("[id^='matches-']").forEach(td => td.textContent = "-");

    // Update matches per client
    data.forEach(item => {
        const td = document.querySelector(`#matches-${item.uuid}`);
        if (td) {
            td.textContent = item.matches;
            td.style.cursor = "pointer";
            td.onclick = () => showMatchedApps(item.uuid, name);
        }
    });
}

// ================= Show matched apps popup =================
async function showMatchedApps(uuid, appName) {
    const res = await fetch(`/api/search/apps/${uuid}?name=${encodeURIComponent(appName)}`);
    const apps = await res.json();

    const tbody = document.querySelector("#popupTable tbody");
    tbody.innerHTML = "";
    apps.forEach(a => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${a.name}</td>
            <td>${a.version}</td>
            <td>${a.install_date}</td>
            <td>${formatSize(a.size_bytes)}</td>
        `;
        tbody.appendChild(tr);
    });

    document.getElementById("popupTitle").textContent = `Matched Apps for Client: ${uuid}`;
    document.getElementById("overlay").style.display = "block";
    document.getElementById("popup").style.display = "block";
}

// ================= Close popup =================
function closePopup() {
    document.getElementById("overlay").style.display = "none";
    document.getElementById("popup").style.display = "none";
}

// ================= Helper =================
function formatSize(bytes) {
    if (!bytes) return "0 MB";
    let mb = bytes / (1024*1024);
    if (mb < 1024) return mb.toFixed(2) + " MB";
    return (mb/1024).toFixed(2) + " GB";
}

// ================= Auto load =================
loadClients();
setInterval(loadClients, 15000); // refresh every 15 sec
</script>
