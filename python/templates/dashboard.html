<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Enterprise Client Monitoring</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin:0;
    font-family:'Segoe UI', sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:white;
}
.container { padding:40px; }
.glass-card {
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(12px);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    margin-bottom:25px;
}
button {
    padding:6px 12px;
    border-radius:8px;
    border:none;
    cursor:pointer;
    font-size:12px;
    margin-right:5px;
}
.global-btn { background:#8b5cf6; color:white; }
.view-btn { background:#3b82f6; color:white; }

table { width:100%; border-collapse:collapse; }
th,td { padding:12px; text-align:left; }
tr { border-top:1px solid rgba(255,255,255,0.08); }

.modal {
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.6);
    display:none;
    justify-content:center;
    align-items:center;
}
.modal-content {
    background:#1e293b;
    padding:20px;
    border-radius:12px;
    width:80%;
    max-height:80%;
    overflow:auto;
}
</style>
</head>
<body>

<div class="container">
<h1>Enterprise Client Monitoring</h1>

<div class="glass-card">
    <button class="global-btn" onclick="openGlobalSearch()">🔎 Global App Search</button>
</div>
</div>

<!-- GLOBAL SEARCH MODAL -->
<div id="globalSearchModal" class="modal">
    <div class="modal-content">
        <h3>Global App Search</h3>
        <input type="text" id="globalSearchInput" placeholder="Enter app name..." style="width:100%;padding:10px;margin-bottom:10px;">
        <button class="global-btn" onclick="runGlobalSearch()">Search</button>
        <div id="globalSearchResults"></div>
        <br>
        <button onclick="closeGlobalSearch()">Close</button>
    </div>
</div>

<!-- DETAILS MODAL -->
<div id="globalDetailsModal" class="modal">
    <div class="modal-content">
        <h3 id="detailsTitle"></h3>
        <div id="detailsBody"></div>
        <br>
        <button onclick="closeDetails()">Close</button>
    </div>
</div>

<script>

const API_BASE="/api";

function formatSize(bytes){
    if(!bytes || bytes===0) return "0 MB";
    const mb=bytes/(1024*1024);
    if(mb<1024) return mb.toFixed(2)+" MB";
    return (mb/1024).toFixed(2)+" GB";
}

function openGlobalSearch(){
    document.getElementById("globalSearchModal").style.display="flex";
}

function closeGlobalSearch(){
    document.getElementById("globalSearchModal").style.display="none";
    document.getElementById("globalSearchResults").innerHTML="";
}

function closeDetails(){
    document.getElementById("globalDetailsModal").style.display="none";
}

async function runGlobalSearch(){
    const query=document.getElementById("globalSearchInput").value;
    if(!query) return;

    const res=await fetch(`${API_BASE}/search/apps?name=${encodeURIComponent(query)}`);
    const results=await res.json();

    if(results.length===0){
        document.getElementById("globalSearchResults").innerHTML="<p>No results found.</p>";
        return;
    }

    let html="<table><tr><th>Hostname</th><th>Matches</th><th>Action</th></tr>";

    results.forEach(r=>{
        html+=`<tr>
            <td>${r.hostname}</td>
            <td>${r.count}</td>
            <td><button class="view-btn" onclick="viewClientResults('${r.uuid}','${query}','${r.hostname}')">View</button></td>
        </tr>`;
    });

    html+="</table>";
    document.getElementById("globalSearchResults").innerHTML=html;
}

async function viewClientResults(uuid, query, hostname){
    const res=await fetch(`${API_BASE}/search/apps/details?uuid=${uuid}&name=${encodeURIComponent(query)}`);
    const results=await res.json();

    document.getElementById("detailsTitle").innerText=`Results for: ${hostname}`;

    let html="<table><tr><th>Name</th><th>Version</th><th>Install Date</th><th>Size</th></tr>";

    results.forEach(r=>{
        html+=`<tr>
            <td>${r.name}</td>
            <td>${r.version}</td>
            <td>${r.install_date}</td>
            <td>${formatSize(r.size_bytes)}</td>
        </tr>`;
    });

    html+="</table>";
    document.getElementById("detailsBody").innerHTML=html;
    document.getElementById("globalDetailsModal").style.display="flex";
}

</script>
</body>
</html>
