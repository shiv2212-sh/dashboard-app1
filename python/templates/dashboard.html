<!DOCTYPE html>
<html>
<head>
    <title>Client Dashboard</title>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .search-box {
            text-align: center;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            width: 250px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        .online {
            color: green;
            font-weight: bold;
        }

        .offline {
            color: red;
            font-weight: bold;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<h1>Client Monitoring Dashboard</h1>

<div class="search-box">
    <input type="text" id="search" placeholder="Search UUID, Hostname, MAC">
    <button onclick="loadClients()">Search</button>
</div>

<table id="clientsTable">
    <thead>
        <tr>
            <th>UUID</th>
            <th>Hostname</th>
            <th>MAC</th>
            <th>IP</th>
            <th>Last Seen</th>
            <th>Status</th>
            <th>Details</th>
        </tr>
    </thead>
    <tbody>
    </tbody>
</table>

<div class="message" id="message"></div>

<script>
async function loadClients() {
    const search = document.getElementById("search").value;
    const messageDiv = document.getElementById("message");
    const tableBody = document.querySelector("#clientsTable tbody");

    tableBody.innerHTML = "";
    messageDiv.innerHTML = "Loading...";

    try {
        const response = await fetch("/api/clients?search=" + encodeURIComponent(search));
        
        if (!response.ok) {
            throw new Error("Server error");
        }

        const data = await response.json();

        tableBody.innerHTML = "";
        messageDiv.innerHTML = "";

        if (data.length === 0) {
            messageDiv.innerHTML = "No clients found.";
            return;
        }

        data.forEach(client => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${client.uuid}</td>
                <td>${client.hostname}</td>
                <td>${client.mac}</td>
                <td>${client.ip}</td>
                <td>${client.last_seen}</td>
                <td class="${client.status === 'Online' ? 'online' : 'offline'}">
                    ${client.status}
                </td>
                <td>
                    <a href="/api/client/${client.uuid}" target="_blank">View</a>
                </td>
            `;

            tableBody.appendChild(row);
        });

    } catch (error) {
        messageDiv.innerHTML = "Error loading clients. Check server or database.";
        messageDiv.classList.add("error");
        console.error(error);
    }
}

// Auto refresh every 30 seconds
setInterval(loadClients, 30000);

// Initial load
loadClients();
</script>

</body>
</html>

</script>

</body>
</html>
