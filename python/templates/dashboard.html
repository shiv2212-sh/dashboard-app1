<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise Client Monitoring</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f4f6f9; color:#1f2937; }
.card { border-radius:14px; border:none; margin-bottom:15px; }
.stat-card { padding:20px; text-align:center; font-weight:600; }
.stat-number { font-size:28px; }
.status-online { color:#22c55e; font-weight:bold; }
.status-offline { color:#ef4444; font-weight:bold; }
.navbar-custom { padding:18px 30px; display:flex; justify-content:space-between; align-items:center; }
.modal-content { max-height:80vh; overflow-y:auto; }
</style>
</head>
<body>

<div class="navbar-custom bg-light">
    <h4>Enterprise Client Monitoring</h4>
    <button class="btn btn-primary" onclick="loadClients()">Refresh</button>
</div>

<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-md-4"><div class="card stat-card shadow-sm">Total Clients<div class="stat-number" id="totalCount">0</div></div></div>
        <div class="col-md-4"><div class="card stat-card shadow-sm">Online<div class="stat-number" id="onlineCount">0</div></div></div>
        <div class="col-md-4"><div class="card stat-card shadow-sm">Offline<div class="stat-number" id="offlineCount">0</div></div></div>
    </div>

    <div class="card p-4 mb-4 shadow-sm">
        <div class="row">
            <div class="col-md-10">
                <input type="text" id="searchInput" class="form-control" placeholder="Search by hostname, UUID, MAC, IP..." onkeyup="loadClients()">
            </div>
            <div class="col-md-2">
                <button class="btn btn-primary w-100" onclick="loadClients()">Search</button>
            </div>
        </div>
    </div>

    <div class="card p-4 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-secondary">
                    <tr><th>UUID</th><th>Hostname</th><th>IP</th><th>MAC</th><th>Last Seen</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody id="clientsTableBody">
                    <tr><td colspan="7" class="text-center">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- CLIENT DETAILS MODAL -->
<div class="modal fade" id="clientModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Client Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="clientDetails">
        Loading...
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API_BASE = "/api";  // Relative path works for Render

async function loadClients(){
    const search = document.getElementById("searchInput").value;
    const tbody = document.getElementById("clientsTableBody");
    tbody.innerHTML=`<tr><td colspan="7" class="text-center">Loading...</td></tr>`;
    try{
        const resp = await fetch(`${API_BASE}/clients?search=${encodeURIComponent(search)}`);
        const clients = await resp.json();
        tbody.innerHTML="";
        let total=clients.length, online=0, offline=0;
        if(total===0){ tbody.innerHTML=`<tr><td colspan="7" class="text-center">No clients found</td></tr>`;}
        clients.forEach(c=>{
            if(c.status==="Online") online++; else offline++;
            const cls=c.status==="Online"?"status-online":"status-offline";
            tbody.innerHTML+=`
                <tr>
                    <td>${c.uuid}</td>
                    <td>${c.hostname}</td>
                    <td>${c.ip}</td>
                    <td>${c.mac}</td>
                    <td>${c.last_seen}</td>
                    <td class="${cls}">${c.status}</td>
                    <td><button class="btn btn-sm btn-info" onclick="viewClient('${c.uuid}')">View</button></td>
                </tr>
            `;
        });
        document.getElementById("totalCount").innerText=total;
        document.getElementById("onlineCount").innerText=online;
        document.getElementById("offlineCount").innerText=offline;
    }catch(e){
        tbody.innerHTML=`<tr><td colspan="7" class="text-center text-danger">Error loading clients</td></tr>`;
    }
}

async function viewClient(uuid){
    const modalEl = document.getElementById("clientModal");
    const modal = new bootstrap.Modal(modalEl);
    const detailsDiv = document.getElementById("clientDetails");
    detailsDiv.innerHTML = "Loading...";
    modal.show();
    try{
        const resp = await fetch(`${API_BASE}/client/${uuid}`);
        const data = await resp.json();
        if(data.error){ detailsDiv.innerHTML="Client not found."; return; }

        let hwHTML="<h6>Hardware Info</h6><ul>";
        for(let k in data.hardware){
            hwHTML+=`<li><strong>${k}:</strong> ${data.hardware[k]}</li>`;
        }
        hwHTML+="</ul>";

        let appsHTML="<h6>Installed Apps</h6><table class='table table-sm table-bordered'><tr><th>Name</th><th>Version</th><th>Install Date</th><th>Size (Bytes)</th></tr>";
        data.apps.forEach(a=>{
            appsHTML+=`<tr>
                <td>${a.name || ""}</td>
                <td>${a.version || ""}</td>
                <td>${a.install_date || ""}</td>
                <td>${a.size_bytes || ""}</td>
            </tr>`;
        });
        appsHTML+="</table>";

        detailsDiv.innerHTML=`
            <p><strong>UUID:</strong> ${data.uuid}</p>
            <p><strong>Hostname:</strong> ${data.hostname}</p>
            <p><strong>MAC:</strong> ${data.mac}</p>
            <p><strong>IP:</strong> ${data.ip}</p>
            <p><strong>Last Seen:</strong> ${data.last_seen}</p>
            ${hwHTML}
            ${appsHTML}
        `;
    }catch(e){
        detailsDiv.innerHTML="Error loading client details.";
    }
}

loadClients();
</script>
</body>
</html>
