<!DOCTYPE html>
<html>
<head>
    <title>Client Dashboard</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #fff;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }

        input {
            padding: 8px;
            width: 300px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th { background: #334155; }

        tr:nth-child(even) { background: #1e293b; }
        tr:nth-child(odd) { background: #273449; }

        button {
            padding: 6px 12px;
            margin-right: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .view-btn { background: #3b82f6; color: white; }
        .pdf-btn { background: #10b981; color: white; }
        .delete-btn { background: #ef4444; color: white; }
        .back-btn { background: #64748b; color: white; margin-bottom: 15px; }

        .online { color: #10b981; font-weight: bold; }
        .offline { color: #ef4444; font-weight: bold; }

        #clientDetail {
            display: none;
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
        }

        .section { margin-bottom: 20px; }

        .card {
            background: #273449;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h1>Client Dashboard</h1>

<!-- 🔎 DASHBOARD SEARCH -->
<input type="text" id="dashboardSearch" placeholder="Search by UUID, Hostname, IP or Status..." onkeyup="filterClients()">

<!-- CLIENT LIST -->
<div id="clientList">
    <table>
        <thead>
            <tr>
                <th>UUID</th>
                <th>Hostname</th>
                <th>IP</th>
                <th>MAC</th>
                <th>Last Seen</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="clientTable"></tbody>
    </table>
</div>

<!-- CLIENT DETAIL -->
<div id="clientDetail">
    <button class="back-btn" onclick="goBack()">← Back</button>

    <h2 id="detailHostname"></h2>

    <div class="section card">
        <p><b>UUID:</b> <span id="detailUUID"></span></p>
        <p><b>IP:</b> <span id="detailIP"></span></p>
        <p><b>MAC:</b> <span id="detailMAC"></span></p>
        <p><b>Last Seen:</b> <span id="detailLastSeen"></span></p>
    </div>

    <div class="section">
        <h3>Hardware Info</h3>
        <div id="hardwareInfo"></div>
    </div>

    <!-- 🔎 APP SEARCH BAR -->
    <input type="text" id="appSearch" placeholder="Search installed applications..." onkeyup="filterApps()">

    <div class="section">
        <h3>Installed Applications</h3>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Version</th>
                    <th>Install Date</th>
                    <th>Size (MB)</th>
                </tr>
            </thead>
            <tbody id="appsTable"></tbody>
        </table>
    </div>
</div>

<script>

let allClients = [];
let currentApps = [];

function formatMB(bytes) {
    if (!bytes) return "0";
    return (bytes / (1024 * 1024)).toFixed(2);
}

function loadClients() {
    fetch("/api/clients")
        .then(res => res.json())
        .then(data => {
            allClients = data;
            renderClients(data);
        });
}

function renderClients(data) {
    const table = document.getElementById("clientTable");
    table.innerHTML = "";

    data.forEach(client => {
        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${client.uuid}</td>
            <td>${client.hostname}</td>
            <td>${client.ip}</td>
            <td>${client.mac}</td>
            <td>${client.last_seen}</td>
            <td class="${client.status === "Online" ? "online" : "offline"}">${client.status}</td>
            <td>
                <button class="view-btn" onclick="viewClient('${client.uuid}')">View</button>
                <button class="pdf-btn" onclick="downloadPDF('${client.uuid}')">PDF</button>
                <button class="delete-btn" onclick="deleteClient('${client.uuid}')">Delete</button>
            </td>
        `;

        table.appendChild(row);
    });
}

function filterClients() {
    const search = document.getElementById("dashboardSearch").value.toLowerCase();

    const filtered = allClients.filter(c =>
        c.uuid.toLowerCase().includes(search) ||
        c.hostname.toLowerCase().includes(search) ||
        c.ip.toLowerCase().includes(search) ||
        c.status.toLowerCase().includes(search)
    );

    renderClients(filtered);
}

function viewClient(uuid) {
    fetch(`/api/client/${uuid}`)
        .then(res => res.json())
        .then(client => {

            document.getElementById("clientList").style.display = "none";
            document.getElementById("dashboardSearch").style.display = "none";
            document.getElementById("clientDetail").style.display = "block";

            document.getElementById("detailHostname").innerText = client.hostname;
            document.getElementById("detailUUID").innerText = client.uuid;
            document.getElementById("detailIP").innerText = client.ip;
            document.getElementById("detailMAC").innerText = client.mac;
            document.getElementById("detailLastSeen").innerText = client.last_seen;

            const hwDiv = document.getElementById("hardwareInfo");
            hwDiv.innerHTML = "";
            for (let key in client.hardware) {
                if (key !== "Disks") {
                    hwDiv.innerHTML += `<div class="card"><b>${key}:</b> ${client.hardware[key]}</div>`;
                }
            }

            currentApps = client.apps;
            renderApps(client.apps);
        });
}

function renderApps(apps) {
    const appsTable = document.getElementById("appsTable");
    appsTable.innerHTML = "";

    apps.forEach(app => {
        appsTable.innerHTML += `
            <tr>
                <td>${app.name}</td>
                <td>${app.version}</td>
                <td>${app.install_date}</td>
                <td>${formatMB(app.size_bytes)} MB</td>
            </tr>
        `;
    });
}

function filterApps() {
    const search = document.getElementById("appSearch").value.toLowerCase();

    const filtered = currentApps.filter(app =>
        app.name.toLowerCase().includes(search) ||
        app.version.toLowerCase().includes(search)
    );

    renderApps(filtered);
}

function downloadPDF(uuid) {
    window.open(`/api/client/${uuid}/pdf`, "_blank");
}

function deleteClient(uuid) {
    if (!confirm("Delete this client?")) return;

    fetch(`/api/client/${uuid}`, { method: "DELETE" })
        .then(() => loadClients());
}

function goBack() {
    document.getElementById("clientDetail").style.display = "none";
    document.getElementById("clientList").style.display = "block";
    document.getElementById("dashboardSearch").style.display = "block";
}

loadClients();

</script>

</body>
</html>
