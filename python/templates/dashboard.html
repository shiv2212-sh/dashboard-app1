<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Dashboard</title>
<style>
body { font-family: Arial; margin:0; padding:0; background:#f0f2f5; }
header { background:#007bff; color:white; padding:10px 20px; font-size:1.5em; }
.container { padding:20px; }
table { border-collapse: collapse; width:100%; background:white; }
th, td { padding:8px 12px; border:1px solid #ddd; text-align:left; }
th { background:#007bff; color:white; }
button { padding:5px 10px; border:none; cursor:pointer; border-radius:4px; }
.btn-view { background:#28a745; color:white; }
.btn-delete { background:#dc3545; color:white; }
.btn-history { background:#17a2b8; color:white; }

.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); }
.modal-content { background:white; margin:5% auto; padding:20px; width:80%; border-radius:6px; max-height:80%; overflow:auto; }
.modal-close { float:right; cursor:pointer; font-weight:bold; font-size:1.2em; }

</style>
</head>
<body>
<header>Client Dashboard</header>
<div class="container">
    <h2>Clients</h2>
    <table id="clients-table">
        <thead>
            <tr>
                <th>Hostname</th>
                <th>IP</th>
                <th>MAC</th>
                <th>Last Seen</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Apps</h2>
    <table id="apps-table">
        <thead>
            <tr>
                <th>Name</th><th>Version</th><th>Install Date</th><th>Size (MB)</th><th>History</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal" id="historyModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div id="historyContent"></div>
    </div>
</div>

<script>
let currentUUID = null;

// Load clients
async function loadClients(){
    const res = await fetch("/api/clients");
    const data = await res.json();
    const tbody = document.querySelector("#clients-table tbody");
    tbody.innerHTML="";
    data.forEach(c=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${c.hostname}</td>
            <td>${c.ip}</td>
            <td>${c.mac}</td>
            <td>${c.last_seen}</td>
            <td>${c.status}</td>
            <td>
                <button class="btn-view" onclick="viewClient('${c.uuid}')">View</button>
                <button class="btn-delete" onclick="deleteClient('${c.uuid}')">Delete</button>
            </td>`;
        tbody.appendChild(tr);
    });
}
loadClients();

// View client apps
async function viewClient(uuid){
    currentUUID = uuid;
    const res = await fetch(`/api/client/${uuid}`);
    const data = await res.json();
    const tbody = document.querySelector("#apps-table tbody");
    tbody.innerHTML="";
    data.apps.forEach(a=>{
        const size = parseFloat(a.size_bytes||0)/(1024*1024);
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${a.name}</td>
            <td>${a.version}</td>
            <td>${a.install_date}</td>
            <td>${size.toFixed(2)}</td>
            <td><button class="btn-history" onclick="viewHistory('${a.name}')">History</button></td>`;
        tbody.appendChild(tr);
    });
}

// Delete client
async function deleteClient(uuid){
    await fetch(`/api/client/${uuid}`,{method:"DELETE"});
    loadClients();
}

// View history modal
async function viewHistory(appName){
    const res = await fetch(`/api/client/${currentUUID}/app/${encodeURIComponent(appName)}/history`);
    const data = await res.json();
    let html = `<h3>History of ${appName}</h3><table><tr><th>Timestamp</th><th>Version</th><th>Install Date</th><th>Size (MB)</th></tr>`;
    data.forEach(d=>{
        html += `<tr>
            <td>${d.timestamp}</td>
            <td>${d.version}</td>
            <td>${d.install_date}</td>
            <td>${(d.size_bytes/1024/1024).toFixed(2)}</td>
        </tr>`;
    });
    html += "</table>";
    document.getElementById("historyContent").innerHTML = html;
    document.getElementById("historyModal").style.display="block";
}

// Close modal
function closeModal(){
    document.getElementById("historyModal").style.display="none";
}

window.onclick = function(event){
    const modal = document.getElementById("historyModal");
    if(event.target==modal) modal.style.display="none";
}
</script>
</body>
</html>
