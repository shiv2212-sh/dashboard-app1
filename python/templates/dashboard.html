<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Client Monitoring Dashboard</title>
<style>
body.dark { background:#121212; color:#e0e0e0; font-family:Arial,sans-serif; }
body.light { background:#f0f0f0; color:#121212; font-family:Arial,sans-serif; }
.container { width:90%; margin:20px auto; }
h1 { text-align:center; }
.toolbar { display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:15px; }
input,button { padding:6px; border-radius:4px; border:1px solid #555; }
body.light input, body.light button { border:1px solid #ccc; }
button { cursor:pointer; background:#333; color:#fff; }
body.light button { background:#ddd; color:#000; }
table { width:100%; border-collapse:collapse; margin-top:10px; }
th,td { border:1px solid #555; padding:6px; }
body.light th,body.light td{border:1px solid #ccc;}
tr:nth-child(even){background:#1a1a1a;}
body.light tr:nth-child(even){background:#f5f5f5;}
#detail-view{display:none;}
</style>
</head>
<body class="dark">
<div class="container">

<div id="main-dashboard">
<h1>Client Monitoring Dashboard</h1>
<div class="toolbar">
  <input id="search" placeholder="Search clients...">
  <div>
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="toggleTheme()">Toggle Dark/Light</button>
  </div>
</div>

<table>
<thead>
<tr><th>UUID</th><th>MAC</th><th>Hostname</th><th>IP</th><th>Last Seen</th><th>Status</th><th>Actions</th></tr>
</thead>
<tbody id="clients-body"></tbody>
</table>
</div>

<div id="detail-view">
<h2>Client Details</h2>
<div class="toolbar">
  <button onclick="backToDashboard()">⬅ Back</button>
  <a id="pdf-link" target="_blank">Export PDF</a>
</div>

<h3>Hardware</h3>
<table><tbody id="hardware-body"></tbody></table>

<h3>Installed Apps</h3>
<input id="app-search" placeholder="Search apps...">
<table>
<thead><tr><th>Name</th><th>Version</th><th>Size</th><th>Install Date</th></tr></thead>
<tbody id="apps-body"></tbody>
</table>
</div>

</div>

<script>
async function loadClients(q=""){
 const res = await fetch(`/api/clients?search=${encodeURIComponent(q)}`);
 const data = await res.json();
 const tbody=document.getElementById("clients-body");
 tbody.innerHTML="";
 if(!data.length){tbody.innerHTML="<tr><td colspan=7>No clients</td></tr>";return;}
 data.forEach(c=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`<td>${c.uuid}</td><td>${c.mac}</td><td>${c.hostname}</td><td>${c.ip}</td>
  <td>${c.last_seen}</td><td>${c.status}</td>
  <td><button onclick="viewClient('${c.uuid}')">View</button></td>`;
  tbody.appendChild(tr);
 });
}

function exportCSV(){window.location.href="/api/export/csv";}

async function viewClient(uuid){
 const res=await fetch(`/api/client/${uuid}`);
 const d=await res.json();
 document.getElementById("main-dashboard").style.display="none";
 document.getElementById("detail-view").style.display="block";
 document.getElementById("pdf-link").href="/api/export/pdf";

 const hw=document.getElementById("hardware-body"); hw.innerHTML="";
 Object.entries(d.hardware).forEach(([k,v])=>{
  hw.innerHTML+=`<tr><th>${k}</th><td>${v}</td></tr>`;
 });

 const apps=document.getElementById("apps-body"); apps.innerHTML="";
 d.apps.forEach(a=>{
  apps.innerHTML+=`<tr><td>${a.name}</td><td>${a.version}</td><td>${a.size}</td><td>${a.install_date}</td></tr>`;
 });

 document.getElementById("app-search").oninput=e=>{
  const q=e.target.value.toLowerCase();
  [...apps.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?"":"none");
 };
}

function backToDashboard(){
 document.getElementById("detail-view").style.display="none";
 document.getElementById("main-dashboard").style.display="block";
}

function toggleTheme(){
 document.body.classList.toggle("dark");
 document.body.classList.toggle("light");
}

document.addEventListener("DOMContentLoaded",()=>{
 loadClients();
 document.getElementById("search").oninput=e=>loadClients(e.target.value);
 setInterval(()=>loadClients(document.getElementById("search").value),15000);
});
</script>
</body>
</html>
