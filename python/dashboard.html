<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard</title>
<style>
    body {
        font-family: 'Segoe UI', sans-serif;
        margin:0; padding:0;
        background: #f5f5f5;
        color:#333;
    }
    header {
        background:#2c3e50;
        color:white;
        padding:15px 20px;
        display:flex; justify-content: space-between; align-items: center;
    }
    header h1 {margin:0; font-size:1.5rem;}
    .dark-mode header {background:#1a252f;}
    .container {padding:20px;}
    table {width:100%; border-collapse: collapse; margin-top:20px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
    th, td {padding:10px; text-align:left; border-bottom:1px solid #ddd;}
    th {background:#34495e; color:white;}
    .dark-mode th {background:#1a252f;}
    button {padding:5px 10px; margin-right:5px; cursor:pointer;}
    .controls {display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
    input[type="text"] {padding:5px; width:200px;}
    .popup {position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:20px; border-radius:8px; box-shadow:0 0 20px rgba(0,0,0,0.3); display:none; z-index:1000; max-height:70%; overflow:auto; width:400px;}
    .popup table {margin-top:10px;}
    .overlay {position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; z-index:900;}
    .dark-mode .popup {background:#2c3e50; color:white;}
</style>
</head>
<body>
<header>
    <h1>Client Dashboard</h1>
    <button onclick="toggleDark()">Toggle Dark Mode</button>
</header>
<div class="container">
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search client..." oninput="searchClients()">
    </div>
    <table id="clientsTable">
        <thead>
            <tr><th>Name</th><th>IP</th><th>Last Seen</th><th>Actions</th></tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<div class="overlay" id="overlay"></div>
<div class="popup" id="popup">
    <h3 id="popupTitle"></h3>
    <div id="popupContent"></div>
    <button onclick="closePopup()">Close</button>
</div>

<script>
let clients = [];

function toggleDark() {
    document.body.classList.toggle("dark-mode");
}

function fetchClients() {
    fetch("/api/clients").then(r=>r.json()).then(data=>{
        clients = data;
        renderClients(data);
    });
}

function renderClients(list) {
    const tbody = document.querySelector("#clientsTable tbody");
    tbody.innerHTML = "";
    list.forEach(c=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${c.name}</td>
            <td>${c.ip}</td>
            <td>${c.last_seen}</td>
            <td>
                <button onclick="viewClient('${c.uuid}')">View</button>
                <button onclick="exportCSV('${c.uuid}')">CSV</button>
                <button onclick="exportPDF('${c.uuid}')">PDF</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function searchClients() {
    const val = document.querySelector("#searchInput").value.toLowerCase();
    const filtered = clients.filter(c=>c.name.toLowerCase().includes(val));
    renderClients(filtered);
}

function viewClient(uuid) {
    fetch(`/api/client/${uuid}`).then(r=>r.json()).then(c=>{
        let html = "<table><tr><th>App Name</th><th>Version</th><th>Install Date</th><th>Size (MB)</th><th>History</th></tr>";
        c.apps.forEach(a=>{
            html += `<tr>
                <td>${a.name}</td>
                <td>${a.version}</td>
                <td>${a.install_date}</td>
                <td>${a.size_mb}</td>
                <td><button onclick="viewHistory('${uuid}','${encodeURIComponent(a.name)}')">History</button></td>
            </tr>`;
        });
        html += "</table>";
        showPopup(c.name, html);
    });
}

function viewHistory(uuid, appName) {
    fetch(`/api/client/${uuid}/history?app=${appName}`).then(r=>r.json()).then(data=>{
        let html = `<table><tr><th>Timestamp</th><th>Version</th></tr>`;
        data.forEach(h=>{
            html += `<tr><td>${h.timestamp}</td><td>${h.version}</td></tr>`;
        });
        html += "</table>";
        showPopup(`History - ${decodeURIComponent(appName)}`, html);
    });
}

function showPopup(title, content) {
    document.getElementById("popupTitle").innerText = title;
    document.getElementById("popupContent").innerHTML = content;
    document.getElementById("popup").style.display = "block";
    document.getElementById("overlay").style.display = "block";
}

function closePopup() {
    document.getElementById("popup").style.display = "none";
    document.getElementById("overlay").style.display = "none";
}

function exportCSV(uuid) {
    window.location.href = `/api/client/${uuid}/csv`;
}

function exportPDF(uuid) {
    window.location.href = `/api/client/${uuid}/pdf`;
}

// Initial load
fetchClients();
</script>
</body>
</html>
